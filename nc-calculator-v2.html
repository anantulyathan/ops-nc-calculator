<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPS Non-Compliance (NC) Calculator V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a2e4a; --navy-2:#223a5c; --blue:#1e4d8c; --blue-mid:#2563a8;
    --teal:#2a9d8f; --teal-lt:#3bbfb0;
    --ink:#2d3748; --grey-mid:#4a5568; --grey-soft:#5b6b80; --line:#e2e8f0; --grey-pale:#f0f4f8;
    --white:#ffffff; --red:#c0392b; --amber:#8f5f0f; --green:#356b4e;
    --shadow:0 1px 2px rgba(26,46,74,.06), 0 8px 24px rgba(26,46,74,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);
       background:radial-gradient(900px 500px at 12% 18%,rgba(42,157,143,.07),transparent 60%),
                  radial-gradient(900px 600px at 92% 40%,rgba(30,77,140,.08),transparent 60%),
                  linear-gradient(180deg,#e6edf5 0%,#f0f4f8 45%,#e9eff6 100%);background-color:#eaf0f6;min-height:100vh;
       font-feature-settings:'tnum' 1,'cv11' 1;padding-bottom:env(safe-area-inset-bottom);line-height:1.45}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* Header */
  header{position:relative;overflow:hidden;color:#fff;padding:28px 16px 92px;
         background:radial-gradient(700px 260px at 88% -10%,rgba(59,191,176,.38),transparent 65%),
                    radial-gradient(600px 300px at 0% 120%,rgba(37,99,168,.55),transparent 65%),
                    linear-gradient(135deg,#142640 0%,#1a2e4a 50%,#1e4d8c 130%)}
  header::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
         background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 56px)}
  header .wrap{position:relative;z-index:1}
  .wrap{max-width:1040px;margin:0 auto}
  .brand{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px 20px}
  .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--teal-lt),var(--teal) 55%,#23857a);display:grid;place-items:center;flex-shrink:0;
        box-shadow:0 6px 16px rgba(10,24,44,.35),inset 0 1px 0 rgba(255,255,255,.35)}
  .mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .brand h1{margin:0;font-size:clamp(17px,2.3vw,22px);font-weight:600;letter-spacing:-.015em;line-height:1.25}
  .brand p{margin:3px 0 0;font-size:13px;color:#aebdd1;font-weight:400}
  .accent{height:3px;background:linear-gradient(90deg,var(--teal),var(--teal-lt))}

  main{position:relative;z-index:2;margin:-60px auto 0;padding:0 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
  main > *, #out > *{max-width:1040px;width:100%;margin-left:auto;margin-right:auto}
  .card{background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);border-radius:16px;
        box-shadow:0 1px 2px rgba(26,46,74,.06),0 10px 30px rgba(26,46,74,.10);border:1px solid rgba(255,255,255,.9);
        outline:1px solid rgba(26,46,74,.05);outline-offset:-1px}

  /* Controls */
  .controls{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--grey-mid);margin-bottom:6px}
  input[type=date]{width:100%;height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:17px;font-weight:600;
       color:var(--navy);background:#fff;transition:border-color .15s,box-shadow .15s}
  input[type=date]:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(42,157,143,.15)}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
  .switch-row b{display:block;font-size:14px;font-weight:600;color:var(--navy);line-height:1.2}
  .switch-row small{display:block;font-size:12px;color:var(--grey-soft);line-height:1.2;margin-top:2px}
  .sw{position:relative;width:46px;height:28px;flex-shrink:0}
  .sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
  .sw i{position:absolute;inset:0;background:#cbd5e0;border-radius:14px;transition:background .2s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw input:checked + i{background:linear-gradient(90deg,var(--teal),var(--teal-lt))}
  .sw input:checked + i::after{transform:translateX(18px)}
  .sw input:focus-visible + i{outline:2px solid var(--teal);outline-offset:2px}
  .btn{height:52px;padding:0 20px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--grey-mid);font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:border-color .15s,color .15s}
  .btn:hover{border-color:var(--blue-mid);color:var(--blue)}
  .dategroup{display:flex;gap:8px}
  .dategroup input{flex:1;min-width:0}
  .today-btn{flex-shrink:0;padding:0 16px;color:#fff;border-color:transparent;background:linear-gradient(135deg,#23857a,#1c6f65);font-weight:600;box-shadow:0 2px 8px rgba(28,111,101,.3)}
  .today-btn:hover{color:#fff;border-color:transparent;background:linear-gradient(135deg,#1f7a6f,#175d55)}

  /* Timeline: runway */
  .tl{position:relative;overflow:hidden;color:#fff;padding:24px 22px 26px;border:0;outline:0;
      background:radial-gradient(280px 280px at var(--mx,50%) var(--my,25%),rgba(255,255,255,.075),transparent 70%),
                 radial-gradient(900px 170px at 50% 100%,rgba(59,191,176,.2),transparent 70%),
                 radial-gradient(520px 240px at 100% 0%,rgba(59,191,176,.22),transparent 65%),
                 radial-gradient(420px 260px at 0% 110%,rgba(37,99,168,.35),transparent 65%),
                 linear-gradient(145deg,#12233b 0%,#1a2e4a 55%,#1d4276 135%);
      box-shadow:0 1px 2px rgba(26,46,74,.1),0 16px 40px rgba(18,35,59,.28)}
  .tl-title{font-size:13px;font-weight:500;color:#9fb3cc;margin:0 0 14px}
  .tl-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .big{display:flex;align-items:center;gap:16px}
  .big .n{font-size:60px;font-weight:700;letter-spacing:-.045em;line-height:.95;color:#fff;
          background:linear-gradient(180deg,#ffffff 20%,#a9c8ea 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .big .n.word{font-size:36px;letter-spacing:-.03em}
  .big .u b{display:block;font-size:16px;font-weight:600;line-height:1.3;max-width:240px}
  .big .u span{display:block;margin-top:2px;font-size:13px;color:#9fb3cc}
  .tl .today{font-size:13px;color:#9fb3cc;padding:7px 12px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
  .tl .today b{color:#6fd6c9;font-weight:600}

  .rwx{position:relative;margin:92px 9px 90px}
  .rw{position:relative;height:46px;border-radius:9px;
      background:linear-gradient(180deg,#0a1729 0%,#12253f 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 2px 6px rgba(0,0,0,.45),0 12px 26px rgba(0,0,0,.35)}
  .rw::before{content:"";position:absolute;left:8px;top:7px;bottom:7px;width:24px;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.6) 0 3px,transparent 3px 7px)}
  .rw::after{content:"";position:absolute;left:44px;right:12px;top:50%;height:2px;transform:translateY(-50%);
      background:repeating-linear-gradient(90deg,rgba(255,255,255,.38) 0 14px,transparent 14px 28px)}
  .lit{position:absolute;left:0;top:0;bottom:0;border-radius:9px 0 0 9px;transition:width .3s ease;
      background:linear-gradient(90deg,rgba(42,157,143,.12),rgba(59,191,176,.5));box-shadow:0 0 24px rgba(59,191,176,.32)}
  .lit.full{border-radius:9px}
  .plane{position:absolute;top:50%;width:34px;height:34px;z-index:3;transform:translate(-50%,-50%) rotate(90deg);transition:left .3s ease;
      filter:drop-shadow(0 4px 7px rgba(0,0,0,.55))}
  .plane svg{width:100%;height:100%;fill:#fff;display:block}
  .plane.idle{opacity:.55}
  .plane .beacon{position:absolute;left:50%;top:46%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#ee8c80;
      box-shadow:0 0 6px 2px rgba(238,140,128,.7);animation:blink 1.1s ease-in-out infinite}

  /* movement behind the plane */
  .lit{overflow:hidden}
  .lit::before{content:"";position:absolute;inset:0;
      background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.2) 14px 22px,rgba(255,255,255,0) 22px 40px);
      background-size:80px 100%;animation:flow 1s linear infinite;
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 75%);mask-image:linear-gradient(90deg,transparent 0,#000 75%)}
  .lit::after{content:"";position:absolute;right:0;top:0;bottom:0;width:70px;
      background:linear-gradient(90deg,rgba(159,236,226,0),rgba(159,236,226,.5));animation:head 1.6s ease-in-out infinite}
  @keyframes flow{to{background-position:80px 0}}
  @keyframes head{0%,100%{opacity:.55}50%{opacity:1}}

  /* runway lights */
  .edge{position:absolute;left:44px;right:14px;height:6px;z-index:1;pointer-events:none;
      background:radial-gradient(circle at 50% 50%,rgba(246,231,200,.38) 0 1.5px,transparent 2.4px) 0 0/22px 6px repeat-x}
  .edge.top{top:4px} .edge.bot{bottom:4px}
  .edge::after{content:"";position:absolute;inset:0;
      background:radial-gradient(circle at 50% 50%,#fff4d8 0 1.7px,transparent 2.8px) 0 0/22px 6px repeat-x;
      filter:drop-shadow(0 0 3px rgba(255,226,170,.95));
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 2.5%,transparent 5%);mask-image:linear-gradient(90deg,transparent 0,#000 2.5%,transparent 5%);
      -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
      animation:chase 2.2s linear infinite}
  @keyframes chase{from{-webkit-mask-position:10% 0;mask-position:10% 0}to{-webkit-mask-position:-50% 0;mask-position:-50% 0}}
  .tlight{position:absolute;top:7px;bottom:7px;width:6px;z-index:1;pointer-events:none;
      background:radial-gradient(circle at 50% 50%,var(--lc) 0 2px,transparent 3.2px) 0 0/6px 11px repeat-y;
      filter:drop-shadow(0 0 3px var(--lc));animation:blink 1.2s ease-in-out infinite}
  .tlight.g{left:1px;--lc:#6fcf9d} .tlight.r{right:1px;--lc:#ee8c80;animation-delay:.6s}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

  /* issue date start line */
  .sm{position:absolute;left:0;top:-4px;width:3px;height:92px;transform:translateX(-50%);z-index:2;border-radius:2px;
      background:linear-gradient(180deg,#8fe6da 0,#8fe6da 54px,rgba(111,214,201,0) 100%);box-shadow:0 0 10px rgba(111,214,201,.55)}
  .sm .t{position:absolute;left:0;top:84px;white-space:nowrap;font-size:12px;line-height:1.3;color:#aebdd1;transform:none}
  .sm .t b{display:block;font-size:13px;font-weight:600;color:#fff}
  @media(prefers-reduced-motion:reduce){ .lit::before,.lit::after,.edge::after,.tlight,.plane .beacon{animation:none!important} .tlight,.plane .beacon{opacity:.8} .edge::after{-webkit-mask-image:none;mask-image:none;opacity:.5} }

  .mk{position:absolute;left:0;top:0;height:0;--mc:#8bb8ec;transition:left .3s ease;z-index:2}
  .mk.c-red{--mc:#ee8c80} .mk.c-navy{--mc:#e2e8f0}
  .mk .pin{position:absolute;left:0;top:-24px;width:2px;height:24px;transform:translateX(-50%);background:linear-gradient(180deg,var(--mc),rgba(255,255,255,0))}
  .mk .pin::before{content:"";position:absolute;left:50%;top:-6px;width:13px;height:13px;border-radius:50%;transform:translateX(-50%);
      border:2px solid var(--mc);background:#12233b}
  .mk.done .pin::before{background:var(--mc);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
  .mk .lab,.mk .dayl{position:absolute;white-space:nowrap;transform:translateX(-50%);text-align:center;line-height:1.3}
  .mk .lab{bottom:34px;font-size:12px;color:#aebdd1}
  .mk .lab b{display:block;font-size:13px;font-weight:600;color:#fff}
  .mk .dayl{top:56px;font-size:12px;font-weight:500;color:#8fa4bf}
  .mk.first .lab,.mk.first .dayl{transform:translateX(-12px);text-align:left}
  .mk.last .lab,.mk.last .dayl{transform:translateX(calc(-100% + 12px));text-align:right}
  .mk.done .lab b{color:#cfe0f3}
  @media(max-width:559px){
    .rwx{margin-top:156px}
    .mk.hi .pin{top:-80px;height:80px}
    .mk.hi .lab{bottom:90px}
    .xs{display:none}
  }
  @media(max-width:359px){ .mk .lab{font-size:11px} .mk .lab b{font-size:12px} .big .n{font-size:52px} }

  /* Levels */
  .levels{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
  .lv{padding:0 22px 0;display:flex;flex-direction:column;overflow:hidden}
  .lv-top{margin:0 -22px 4px;padding:20px 22px 14px;background:linear-gradient(160deg,var(--t1),var(--t2) 60%,rgba(255,255,255,0))}
  .l1{--t1:#f7dedb;--t2:#fbefed} .l2{--t1:#d9e5f5;--t2:#ebf1f9} .l3{--t1:#f6e8cc;--t2:#fbf4e3}
  .lv-head{display:flex;align-items:center;gap:12px}
  .badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;
         box-shadow:0 4px 10px rgba(26,46,74,.22),inset 0 1px 0 rgba(255,255,255,.3)}
  .b1{background:linear-gradient(145deg,#d9503f,#a93226)} .b2{background:linear-gradient(145deg,#2f6fba,#1a4380)} .b3{background:linear-gradient(145deg,#d19a35,#9c6a16)}
  .lv h3{margin:0;font-size:16px;font-weight:600;color:var(--navy);letter-spacing:-.005em}
  .lv .desc{margin:10px 0 0;font-size:13px;color:var(--grey-mid);line-height:1.5;min-height:39px}
  .row{padding:14px 0;border-top:1px solid var(--line)}
  .rl{font-size:13px;color:var(--grey-mid);font-weight:500}
  .rd{font-size:24px;font-weight:600;color:var(--navy);letter-spacing:-.02em;margin:2px 0 4px}
  .rs{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--grey-soft)}
  .ok .dot{background:var(--green)} .ok .rs{color:var(--green)}
  .warn .dot{background:var(--amber)} .warn .rs{color:var(--amber)}
  .over .dot{background:var(--red)} .over .rs{color:var(--red)}
  .na .rs{color:var(--grey-soft)}
  .fm{margin-top:4px;font-size:11.5px;color:var(--grey-soft)}
  .row.ext{background:linear-gradient(135deg,#e3ecf8 0%,#f1f5fb 70%,#f8fafc 100%);margin:0 -22px;padding:14px 22px;border-top-color:#cfdcee}
  .foot{margin:auto -22px 0;padding:13px 22px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.5;color:var(--grey-mid);background:linear-gradient(180deg,#f8fafc,#eef3f8)}
  .foot.crit{color:#8a2c1f;background:linear-gradient(180deg,#fbf1ef,#f6e0dc);border-top-color:#efcfca}
  .foot b{font-weight:600}

  .policy{padding:16px 20px;border-left:4px solid var(--teal);border-radius:12px;background:linear-gradient(90deg,#e4f3f1 0%,#ffffff 45%);box-shadow:0 1px 2px rgba(26,46,74,.06),0 8px 22px rgba(26,46,74,.08);font-size:13.5px;color:var(--grey-mid)}
  .policy b{color:var(--navy)}
  .policy ul{margin:8px 0 0;padding-left:20px;line-height:1.6}

  .empty{padding:48px 20px;text-align:center}
  .empty svg{width:40px;height:40px;stroke:var(--teal);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .empty h3{margin:12px 0 4px;color:var(--navy);font-size:17px}
  .empty p{margin:0;color:var(--grey-soft);font-size:14px}

  @media(min-width:760px){
    header{padding:26px 24px 96px}
    main{padding:0 24px 56px}
    .controls{grid-template-columns:minmax(260px,1fr) 1.4fr auto;align-items:end;padding:22px}
    .levels{grid-template-columns:repeat(3,1fr);align-items:stretch}
    .tl{padding:26px 30px 22px}
  }
  @media(prefers-reduced-motion:reduce){ *{transition:none!important} }

  /* share summary */
  .share{padding:20px 22px;display:grid;gap:16px}
  .share h2{margin:0;font-size:16px;font-weight:600;color:var(--navy)}
  .share .sub{margin:2px 0 0;font-size:13px;color:var(--grey-soft)}
  .pickrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .pl{font-size:13px;color:var(--grey-mid);font-weight:500;margin-right:2px}
  .pick{position:relative;cursor:pointer}
  .pick input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
  .pk{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 8px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
      font-size:13.5px;font-weight:500;color:var(--grey-mid);transition:border-color .15s,background .15s,color .15s}
  .mini{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;transition:opacity .15s}
  .pk .ck{width:18px;height:18px;padding:3px;border-radius:50%;background:var(--teal);stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
  .pick input:checked + .pk{border-color:var(--blue);background:#eef3fa;color:var(--navy)}
  .pick input:checked + .pk .ck{opacity:1}
  .pick input:not(:checked) + .pk .mini{opacity:.45}
  .pick input:focus-visible + .pk{outline:2px solid var(--teal);outline-offset:2px}
  .share-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .bubble{background:linear-gradient(180deg,#eef3fa,#e6edf7);border:1px solid #d5e0f0;border-radius:14px 14px 14px 4px;padding:16px 18px;
      font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .bubble b{color:var(--navy)}
  .acts{display:flex;gap:10px;flex-wrap:wrap;align-content:flex-start}
  .btn-p,.btn-g{height:50px;padding:0 20px;border-radius:10px;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
  .btn-p{border:0;color:#fff;background:linear-gradient(135deg,#23857a,#1c6f65);box-shadow:0 4px 12px rgba(28,111,101,.3)}
  .btn-p:hover{background:linear-gradient(135deg,#1f7a6f,#175d55)}
  .btn-g{border:1.5px solid var(--line);background:#fff;color:var(--grey-mid);font-weight:500}
  .btn-g:hover{border-color:var(--blue-mid);color:var(--blue)}
  .btn-p svg,.btn-g svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn-p:disabled,.btn-g:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .hint{width:100%;font-size:12.5px;color:var(--grey-soft);margin:2px 0 0}
  .toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;max-width:calc(100vw - 36px);background:var(--navy);color:#fff;font-size:13.5px;font-weight:500;
      padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(18,35,59,.35);display:flex;align-items:center;gap:10px;
      opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:none}
  .toast i{width:20px;height:20px;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex-shrink:0}
  .toast i svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  @media(min-width:760px){ .share-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start} }

  /* print: only the selected summary */
  #printSheet{display:none}
  @media print{
    body{background:#fff!important;min-height:0}
    body > *:not(#printSheet){display:none!important}
    #printSheet{display:block;font-family:'Inter',system-ui,sans-serif;color:#1a2e4a}
    #printSheet .po{font-size:12px;color:#4a5568;margin:0 0 4px}

  <div id="out" style="display:contents"></div>
</main>
<footer class="helpnote"><p>Having trouble using the app, or seeing an error? Please contact HCT directly at <a href="mailto:anan.t@caat.or.th">anan.t@caat.or.th</a></p></footer>

  function timeline(issue,extOn){
    const maxDay = extOn ? 120 : 60;
    const short = d => new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'}).format(d);
    const marks = [
      {d:3,  gate:'CAP', gx:'', sub:'L1',          levels:'L1',        ms:'CAP', color:'c-red', next:'L1 CAP', note:'Non-extendable. If implementation fails, operations may be suspended immediately.'},

    ];
    if(extOn) marks.push({d:120, gate:'Extension limit', sub:'L2 and OBS', levels:'L2 and OBS', ms:'Maximum extension date', color:'c-navy', next:'the maximum extension date for L2 and OBS', note:'Total time cannot exceed 120 days from the original issue date.'});
    tlState={issue,marks,maxDay};
    const elapsed = -daysLeft(issue);
    const dl = d => daysLeft(addDays(issue,d));

    /* heading chip */
    let todayText='';
    if(elapsed<0){ todayText='The issue date is in <b>'+plural(-elapsed,'day')+'</b>'; }

    let pct=0, planeCls='plane';

    else if(elapsed>=maxDay){ pct=100; }

    const nextIdx = elapsed>=0 ? marks.findIndex(m=>dl(m.d)>=0) : -1;
    const mk = marks.map((m,i)=>{
      const p=m.d/maxDay*100;
      const pos = p<10 ? 'first' : (p>88 ? 'last' : '');
      const done = dl(m.d)<0 ? 'done' : '';
      const hi = i%2===1 ? 'hi' : '';
      const nx = i===nextIdx ? 'next' : '';
      return `<div class="mk ${m.color} ${pos} ${done} ${hi} ${nx}" style="left:${p}%;--i:${i}" role="button" tabindex="0" aria-pressed="false" data-d="${m.d}" aria-label="${esc(m.ms)} for ${esc(m.levels)}, ${esc(short(addDays(issue,m.d)))}"><span class="hit"></span><span class="pin"></span>
        <span class="lab"><b>${esc(m.gate)}${m.gx?'<span class="xs">'+esc(m.gx)+'</span>':''}</b>${m.sub?esc(m.sub)+'<br>':''}${esc(short(addDays(issue,m.d)))}</span>
        <span class="dayl">Day ${m.d}</span></div>`;
    }).join('');
    const elapsedDays=Math.max(0,elapsed);
    const tiles = marks.map((m,i)=>{
      const n=dl(m.d);
      const st = n<0 ? {c:'over',t:plural(Math.abs(n),'day')+' overdue'}
               : n===0 ? {c:'warn',t:'Due today'}
               : n<=7 ? {c:'warn',t:plural(n,'day')+' left'}
               : {c:'ok',t:plural(n,'day')+' left'};
      const dn=Math.min(elapsedDays,m.d), w=Math.round(dn/m.d*1000)/10;
      const cls=[m.color, n<0?'done':'', i===nextIdx?'next':''].join(' ');
      return `<div class="tile ${cls}" style="--i:${i}" role="button" tabindex="0" aria-pressed="false" data-d="${m.d}" title="Show on the runway"><div class="trow"><b>${esc(m.levels)}</b></div>
        <div class="tn">${esc(m.ms)}</div><div class="td">${esc(fmt(addDays(issue,m.d)))}</div>
        <div class="ts ${st.c}"><i></i><span class="st">${esc(st.t)}</span><span class="tof">Day ${dn} of ${m.d}</span></div>
        <div class="tpb ${st.c}"><u style="--w:${w}%"></u></div></div>`;
    }).join('');
    const xmas = issue.getMonth()===11 && (issue.getDate()===24 || issue.getDate()===25);
    const ax = Math.round(30 + 40*pct/100);
    tlState.xmas=xmas; tlState.pct=pct;

    const showHint = !planeTried && !hintUsed; hintUsed = true;

        +'<polygon points="30,0 31.8,4.4 36.4,4.6 32.8,7.4 34,12 30,9.4 26,12 27.2,7.4 23.6,4.6 28.2,4.4" fill="#f0c479"/>'
        +lights.map((l,k)=>'<circle class="tw" cx="'+l[0]+'" cy="'+l[1]+'" r="1.7" fill="'+LC[l[2]]+'" style="animation-delay:-'+(((k+i)*0.37)%2).toFixed(2)+'s"/>').join('')
        +'</svg>';
      const spots=[[1,120,.8,'',0],[8.5,86,.55,'t2',1],[17,60,.4,'t2',2],[80,62,.4,'t2',3],[87,92,.55,'t2',4],[94.5,124,.8,'',5]];

    let snow='';
    if(xmas){ snow='<div class="snow" aria-hidden="true">'; for(let i=0;i<34;i++){ const sz=2+(i*7)%3, o=.35+((i*13)%5)/10; snow+='<i style="left:'+((i*29+7)%100)+'%;width:'+sz+'px;height:'+sz+'px;opacity:'+o+';animation-duration:'+(8+(i*5)%7)+'s;animation-delay:-'+((i*1.7)%12).toFixed(1)+'s;--dx:'+(((i%5)-2)*14)+'px"></i>'; } snow+='</div>'; }


    return `<section class="card tl" aria-label="Timeline">${snow}<div class="floor" aria-hidden="true"></div>${trees}
      <div class="tl-top"><p class="tl-title">Timeline from the issue date, ${esc(fmt(issue))}</p><div class="today">${todayText}</div></div>

        <div class="${planeCls} v-${vid}${V.wide?' wide':''}${vid==='santa'?' santa':''}${planeTried?' known':''} go" role="button" tabindex="0" aria-label="${V.label} take-off" title="Take off" style="left:${pct}%;--to:${pct}%;--ax:${ax}">${ART[vid]}<i class="beam"></i><i class="jet"></i><i class="beacon"></i></div>${showHint?`<span class="phint" style="${pct>80?'right:calc('+(100-pct)+'% + '+(Math.round(V.w*axv/100)+14)+'px)':'left:calc('+pct+'% + '+(Math.round(V.w*(100-axv)/100)+14)+'px)'}">${vid==='santa'?'Tap Santa':'Tap me'}</span>`:''}${mk}</div><div class="banner" aria-live="polite"></div></div>

      <div class="dp" id="dp" aria-live="polite"></div>
    </section>`;

  const sel={l1:false,l2:true,l3:true};
  const ICON_COPY='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  function currentIssue(){ return issueEl.value ? parseLocal(issueEl.value) : null; }

  function sections(issue,extOn){
    const f=d=>fmt(addDays(issue,d));

  function toast(msg){
    let t=$('toast');

    t.innerHTML='<i>'+ICON_CHECK+'</i><span>'+esc(msg)+'</span>';
    t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),3000);

  function copyText(text,okMsg){
    const done=ok=>toast(ok?okMsg:'Could not copy. Select the text and copy it manually.');
    function fallback(){
      const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); done(ok);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>done(true),fallback); } else { fallback(); }
  }

    return location.href.split('#')[0].split('?')[0]+'?'+q.toString().replace(/%2C/g,',');

        if(back===d) issueEl.value=d;
      }
      if(q.get('x')==='1') extChk.checked=true;
      if(q.has('l')){
        const ls=q.get('l').split(',').map(k=>k==='obs'?'l3':k).filter(k=>['l1','l2','l3'].includes(k));
        if(ls.length) ['l1','l2','l3'].forEach(k=>{ sel[k]=ls.includes(k); });
      }

  outEl.addEventListener('change',e=>{ const t=e.target; if(t && t.matches && t.matches('input[data-lv]')){ sel[t.getAttribute('data-lv')]=t.checked; updateShare(); } });
  /* ---------- interactive timeline ---------- */
  const wkFmt=new Intl.DateTimeFormat('en-GB',{weekday:'long'});

  const reduceMotion=()=>!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);


  /* Definitions: OPSM Chapter 8: AOC Management, (c) Non-Compliance Levels and Resolution Time Frames */
  const RESUB='In the case of unsatisfactory CAP responses, the operator will be required to resubmit their CAPs within the allowable timeframe and within 3 allowable CAP response attempts.';
  const DEFS={
    l1:{tab:'L1',title:'Level 1 Finding (L1)',
      def:`<p>A level 1 finding shall be issued by the competent authority when any significant Non-Compliance is detected with the applicable requirements, with the organization's procedures and manuals or with the terms of an approval, certificate, specialized operation authorization or with the content of a declaration <b>which lowers safety or seriously endangers flight safety.</b></p>
        <p>The level 1 findings shall include, but are not limited to:</p>

          <li><span class="dn">(1)</span><span>Failure to give the competent authority access to the facilities or *documents of the organization;</span></li>
          <li><span class="dn">(2)</span><span>Obtaining or maintaining the validity of the organization certificate or specific approvals by falsification of submitted documentary evidence;</span></li>
          <li><span class="dn">(3)</span><span>Evidence of malpractice or fraudulent use of the organization's certificate or specific approvals;</span></li>
          <li><span class="dn">(4)</span><span>The lack of an accountable manager.</span></li>
          <li><span class="dn">(5)</span><span>The absence (omission, not addressed) or total breakdown (commission, failure, not implemented) of a system to meet a specified requirement.<br>Several level 2 non-compliance against one requirement, or requirements for a same topic can represent a total breakdown of the system and thus be considered as a level 1 non-compliance.</span></li>
          <li><span class="dn">(6)</span><span>A Non-Compliance or a series of non-compliance that in the judgement and experience of the auditor is likely to either result in the failure of the management system or to substantially reduce its ability to assure controlled processes and products shall be categorized as a level 1.</span></li>
        </ol>
        <p class="dnote"><i>*Note: documents mean data records or documents that only relating to the audit/inspection and not include irrelevant data records or documents such as personal privacy data or documents that protected by investigation law etc.</i></p>`,
      resp:`<p>For L1 findings, the operator shall submit their corrective action plan (CAP) that addresses the root cause to CAAT within a maximum of 3 days after the issuance. ${RESUB}</p>`},
    l2:{tab:'L2',title:'Level 2 Finding (L2)',
      def:`<p>A level 2 finding shall be issued by CAAT when a non-compliance is detected against the operator's procedures or manuals, applicable regulations and requirements, the terms of an approval or a certificate, specific approvals, or with the contents of a declaration <b>which could lower safety or seriously hazards flight safety.</b></p>`,
      resp:`<p>The operator is required to submit a corrective action plan that addresses the root cause within 30 days after the finding has been uploaded, followed by a 30-day period of CAP implementation. In total, the timescale for corrective action should not exceed 60 days. In the case where an extension is requested by the operator, the allowable period for CAP implementation can be extended by 60 days (not exceeding the initial duration granted to resolve the finding).</p>
        <p>${RESUB}</p>`},
    obs:{tab:'OBS',title:'Observation (OBS)',
      def:`<p>Observations are recommendations providing opportunities for improvement. The management system that may be weak, cumbersome, redundant, overly complex, or in some other manner, may, in the opinion of the auditor, offer an opportunity for an organization to improve its current practice. An observation is not subject to any corrective actions unless the operator decides to improve. It is not required to report to CAAT on the implementation of actions further to an observation and CAAT will not monitor the implementation of these actions.</p>`,
      resp:`<p>An observation is not subject to any corrective actions. However, if an operator decides to accept the observation, the same process and timeline for submitting the corrective action for the 'Level 2 finding' shall apply.</p>`}
  };
  let defLv=null; const defOpen={all:false};
  function defsHtml(m){
    const lvs=m.levels==='L1'?['l1']:['l2','obs'];
    if(lvs.indexOf(defLv)<0) defLv=lvs[0];
    const D=DEFS[defLv];
    const tabs=lvs.length>1?`<div class="dtabs" role="tablist" aria-label="Level definitions">${lvs.map(k=>`<button type="button" class="dtab" role="tab" data-act="deftab" data-lv="${k}" aria-selected="${k===defLv}">${DEFS[k].tab}</button>`).join('')}</div>`:'';
    return `<details class="defs" data-k="all"${defOpen.all?' open':''}><summary>Definition and operator responsibility</summary>${tabs}<p class="dtitle">${D.title}</p>
      <div class="dcols"><div class="dcol"><h4>Definition and issuance by CAAT</h4>${D.def}</div><div class="dcol"><h4>Operator responsibility</h4>${D.resp}</div></div>
      <p class="dsrc">Source: OPSM Chapter 8: AOC Management, (c) Non-Compliance Levels and Resolution Time Frames</p></details>`;
  }

  function applySel(){
    const root=outEl.querySelector('.tl'); if(!root||!tlState) return;
    if(selDay!==null && !tlState.marks.some(m=>m.d===selDay)) selDay=null;
    root.querySelectorAll('.tile[data-d],.mk[data-d]').forEach(e=>{ const on=+e.getAttribute('data-d')===selDay; e.classList.toggle('sel',on); e.setAttribute('aria-pressed',on?'true':'false'); });
    root.classList.toggle('has-sel',selDay!==null);
    const band=root.querySelector('.selband'), dp=$('dp'); if(!band||!dp) return;
    if(selDay===null){ band.classList.remove('on'); band.style.width='0'; dp.className='dp'; dp.innerHTML=''; return; }
    const m=tlState.marks.find(x=>x.d===selDay), date=addDays(tlState.issue,m.d), n=daysLeft(date);
    band.style.width=(m.d/tlState.maxDay*100)+'%'; band.classList.add('on');
    const st = n<0 ? ['over',plural(Math.abs(n),'day')+' overdue'] : n===0 ? ['warn','Due today'] : n<=7 ? ['warn',plural(n,'day')+' left'] : ['ok',plural(n,'day')+' left'];
    const wk=date.getDay()===0||date.getDay()===6;
    dp.className='dp open';
    dp.innerHTML=`<div class="dp-main"><span class="dp-k">${esc(m.levels)} · ${esc(m.ms)}</span>
      <b class="dp-d">${esc(wkFmt.format(date))} ${esc(fmt(date))}${wk?'<em class="wkd">Weekend</em>':''}</b>
      <span class="dp-s ts ${st[0]}"><i></i>${esc(st[1])}<span class="dp-of">Day ${m.d} after the issue date</span></span>
      ${m.note?`<span class="dp-n">${esc(m.note)}</span>`:''}</div>
      <div class="dp-act"><button type="button" class="dbtn" data-act="copydate">${ICON_COPY}Copy date</button><button type="button" class="dbtn ghost" data-act="clear" aria-label="Close details"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>${defsHtml(m)}`;
  }
  function selectDay(d){
    selDay = selDay===d ? null : d; applySel();
    const dp=$('dp'); if(selDay!==null && dp && dp.scrollIntoView) dp.scrollIntoView({block:'nearest',behavior:reduceMotion()?'auto':'smooth'});
  }
  function copyDate(){
    if(selDay===null||!tlState) return;
    const m=tlState.marks.find(x=>x.d===selDay); if(!m) return;
    copyText(m.ms+' ('+m.levels+'): '+fmt(addDays(tlState.issue,m.d)),'Date copied');
  }

  /* hover link between cards and gates */
  function clearHl(){ outEl.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl')); }
  outEl.addEventListener('mouseover',e=>{
    const h=e.target.closest && e.target.closest('.tile[data-d],.mk[data-d]'); clearHl();
    if(h) outEl.querySelectorAll('[data-d="'+h.getAttribute('data-d')+'"]').forEach(x=>x.classList.add('hl'));
  });
  outEl.addEventListener('toggle',e=>{ const d=e.target; if(d && d.matches && d.matches('details.defs')) defOpen.all=d.open; },true);
  outEl.addEventListener('mouseleave',clearHl);
  outEl.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse'||reduceMotion()) return;
    const t=e.target.closest&&e.target.closest('.tile'); if(!t) return;
    const r=t.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
    t.style.setProperty('--ry',(px*10).toFixed(1)+'deg'); t.style.setProperty('--rx',(-py*8).toFixed(1)+'deg');
  });
  outEl.addEventListener('pointerout',e=>{
    const t=e.target.closest&&e.target.closest('.tile');
    if(t && !t.contains(e.relatedTarget)){ t.style.removeProperty('--rx'); t.style.removeProperty('--ry'); }
  });

  /* day probe on the runway */
  let probeT=0;
  function hideProbe(){ const p=outEl.querySelector('.probe'); if(p) p.classList.remove('on'); }
  function showProbe(e){
    const rw=e.target.closest && e.target.closest('.rw');
    if(!rw||!tlState||flying||e.target.closest('.mk,.plane')){ hideProbe(); return; }
    const r=rw.getBoundingClientRect(); if(!r.width) return;
    const x=Math.min(r.width,Math.max(0,e.clientX-r.left));
    const day=Math.round(x/r.width*tlState.maxDay), date=addDays(tlState.issue,day), px=day/tlState.maxDay*r.width;
    const p=rw.querySelector('.probe'), t=p.querySelector('.pt');
    t.textContent=(day===0?'Issue date':'Day '+day)+' · '+wkShort.format(date)+' '+fmt(date);
    p.style.left=px+'px'; p.classList.add('on');
    const w=t.offsetWidth; let off=-w/2;
    if(px+off<-12) off=-12-px; if(px+off+w>r.width+12) off=r.width+12-w-px;
    t.style.transform='translateX('+off+'px)';
    if(e.pointerType==='touch'){ clearTimeout(probeT); probeT=setTimeout(hideProbe,2200); }
  }
  outEl.addEventListener('pointermove',showProbe);
  outEl.addEventListener('pointerdown',showProbe);
  outEl.addEventListener('pointerleave',hideProbe);

  /* take-off */
  function puffs(rw,xs,delays){
    xs.forEach((x,i)=>{
      const p=document.createElement('i'); p.className='puff'; p.style.left=Math.max(4,x)+'px'; rw.appendChild(p);
      const a=p.animate([{opacity:.6,transform:'translate(-50%,0) scale(.4)'},{opacity:0,transform:'translate(-50%,-16px) scale(1.9)'}],{duration:750,delay:delays[i],easing:'ease-out',fill:'forwards'});
      a.onfinish=()=>p.remove();
    });
  }
  function ring(rw,x){
    const r=document.createElement('i'); r.className='ring'; r.style.left=x+'px'; rw.appendChild(r);
    const a=r.animate([{opacity:.9,transform:'scale(.3)'},{opacity:0,transform:'scale(5)'}],{duration:650,easing:'ease-out',fill:'forwards'}); a.onfinish=()=>r.remove();
  }
  function takeOff(plane){
    if(flying||!plane.isConnected) return;
    const rw=plane.closest('.rw'), lit=rw.querySelector('.lit'), tl=plane.closest('.tl'), ban=tl.querySelector('.banner');
    const token=++flight; flying=true; planeTried=true; plane.classList.add('known');
    const alive=()=>token===flight && plane.isConnected;
    let bt=0; const say=t=>{ ban.textContent=t; ban.classList.add('show'); clearTimeout(bt); bt=setTimeout(()=>ban.classList.remove('show'),1000); };
    const at=(ms,fn)=>setTimeout(()=>{ if(alive()) fn(); },ms);
    const vid=(plane.className.match(/\bv-(\w+)/)||[])[1]||'plane', V=VEH[vid]||VEH.plane, TX=V.say, vert=V.mode==='vert';
    const ph0=rw.querySelector('.phint'); if(ph0) ph0.remove();
    if(reduceMotion()){ say(TX[0]); at(1300,()=>{ flying=false; }); return; }

    const W=rw.clientWidth, x0=plane.offsetLeft, litW=lit.offsetWidth, D=V.D, RET=V.RET;
    const op=parseFloat(getComputedStyle(plane).opacity)||1;
    const roll=vert?x0:Math.max(x0,Math.min(W-8,Math.max(W*.9,x0+W*.12)));
    const ax=V.wide?(parseFloat(plane.style.getPropertyValue('--ax'))||50):50;
    const tf=(dy,deg,sc)=>'translate(-'+ax+'%,calc(-50% - '+dy+'px)) rotate('+deg+'deg) scale('+sc+')';
    const S=sc=>1+(sc-1)*V.sk, O=o=>o==='o'?op:o;
    plane.classList.remove('go'); lit.classList.remove('go'); plane.classList.add('flying'); rw.classList.add('tko');
    hideProbe();

    const fly=plane.animate(V.out.map(p=>{ const k={offset:p[0],left:(x0+(roll-x0)*p[1]+W*p[2])+'px',transform:tf(p[3],V.r0+p[4],S(p[5])),opacity:O(p[6])}; if(p[7]) k.easing=p[7]; return k; }),{duration:D,fill:'forwards'});
    const ro=V.out[1][0];
    const litA=vert
      ? lit.animate([{opacity:1,offset:0},{opacity:0,offset:.25},{opacity:0,offset:1}],{duration:D,fill:'forwards'})
      : lit.animate([{width:litW+'px',offset:0,easing:EA},{width:roll+'px',opacity:1,offset:ro},{width:roll+'px',opacity:1,offset:ro+.16},{width:roll+'px',opacity:0,offset:1}],{duration:D,fill:'forwards'});
    if(!vert){ const N=8; puffs(rw,Array.from({length:N},(_,i)=>x0+(roll-x0)*(i/(N-1))),Array.from({length:N},(_,i)=>D*ro*Math.sqrt(i/(N-1)))); }
    else if(vid==='heli'){ puffs(rw,[x0-46,x0-30,x0-14,x0+2,x0+18,x0+34,x0+50,x0-38,x0+42],[0,60,120,180,240,300,360,420,480]); }
    else if(vid==='hero'){ puffs(rw,[x0-20,x0-8,x0+4,x0+16],[120,140,160,180]); }

    say(TX[0]);
    at(D*.48,()=>say(TX[1]));
    at(D*.74,()=>say(TX[2]));
    if(vid==='jet') at(D*.5,()=>ring(rw,roll+W*.02));
    at(D+250,()=>{
      fly.cancel(); litA.cancel(); rw.classList.remove('tko'); if(!V.keepFly) plane.classList.remove('flying');
      if(vert){ lit.animate([{opacity:0},{opacity:1}],{duration:RET}); } else { plane.classList.add('go'); lit.classList.add('go'); }
      plane.animate(V.ret.map(p=>{ const k={offset:p[0],transform:tf(p[2],V.r0+p[3],S(p[4])),opacity:O(p[5])}; if(vert) k.left=(x0+W*p[1])+'px'; if(p[6]) k.easing=p[6]; return k; }),{duration:RET});
      say(TX[3]);
    });
    at(D+250+RET,()=>{
      if(V.keepFly) plane.classList.remove('flying');
      puffs(rw,vert?[x0-24,x0-10,x0+4,x0+18,x0+30]:[x0-50,x0-38,x0-26,x0-14,x0-4],[0,60,120,180,240]);
      if(vid==='hero') rw.animate([{transform:'translateY(0)'},{transform:'translateY(3px)'},{transform:'translateY(0)'}],{duration:280});
      say(TX[4]); flying=false;
    });
  }

  /* vehicle picker */
  function applyVehicle(){
    const root=outEl.querySelector('.tl'); if(!root||!tlState) return;
    const pl=root.querySelector('.plane'); if(!pl) return;
    const vid=effVid(tlState.xmas), V=VEH[vid];
    const keep=['idle','known','go'].filter(c=>pl.classList.contains(c));
    pl.className=['plane','v-'+vid].concat(V.wide?['wide']:[],vid==='santa'?['santa']:[],keep,['swap']).join(' ');
    pl.innerHTML=ART[vid]+'<i class="beam"></i><i class="jet"></i><i class="beacon"></i>';
    pl.style.setProperty('--ax',Math.round(30+40*tlState.pct/100));
    pl.setAttribute('aria-label',V.label+' take-off');
    setTimeout(()=>pl.classList.remove('swap'),450);
    const h=root.querySelector('.hint'); if(h) h.textContent='Tap a card or a gate to see its date. Tap '+V.hint+' for a surprise.';
    const ph=root.querySelector('.phint'); if(ph) ph.remove();
  }
  function setVeh(id){
    if(!VEH[id]||id==='santa'||flying) return;
    veh=id; try{ localStorage.setItem('ncVeh',id); }catch(e){}
    outEl.querySelectorAll('.vb').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute('data-v')===id?'true':'false'));
    applyVehicle();
  }

  outEl.addEventListener('click',e=>{
    const vb=e.target.closest('.vb'); if(vb){ setVeh(vb.getAttribute('data-v')); return; }
    const a=e.target.closest('[data-act]');
    if(a){ const act=a.getAttribute('data-act'); if(act==='copydate') copyDate(); else if(act==='deftab'){ defLv=a.getAttribute('data-lv'); applySel(); const t=$('dp').querySelector('.dtab[aria-selected="true"]'); if(t) t.focus(); } else { selDay=null; applySel(); } return; }
    const t=e.target.closest('.tile[data-d],.mk[data-d]'); if(t){ selectDay(+t.getAttribute('data-d')); return; }
    const pl=e.target.closest('.plane'); if(pl){ takeOff(pl); return; }
    const b=e.target.closest('button'); if(!b||b.disabled) return; if(b.id==='copyBtn') copySummary(); else if(b.id==='linkBtn') copyLink(); else if(b.id==='printBtn') window.print();
  });
  outEl.addEventListener('keydown',e=>{
    if(e.key==='Escape' && selDay!==null){ selDay=null; applySel(); return; }
    if(e.key!=='Enter' && e.key!==' ') return;
    const t=e.target.closest && e.target.closest('.tile[data-d],.mk[data-d],.plane');
    if(t && t===e.target){ e.preventDefault(); t.click(); }
  });
  outEl.addEventListener('pointermove',e=>{
    const t=e.target.closest && e.target.closest('.tl'); if(!t) return;
    const r=t.getBoundingClientRect();
    t.style.setProperty('--mx',(e.clientX-r.left)+'px'); t.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
  issueEl.addEventListener('input',render);
  issueEl.addEventListener('change',render);
  extChk.addEventListener('change',render);
  $('todayBtn').addEventListener('click',()=>{ issueEl.value=todayStr(); render(); });
  $('resetBtn').addEventListener('click',()=>{ issueEl.value=todayStr(); extChk.checked=false; render(); });

  $('asof').innerHTML='Today <b>'+esc(fmt(new Date()))+'</b>';
  issueEl.value=todayStr();
  applyParams();
  render();
})();
</script>
</body>
</html>
