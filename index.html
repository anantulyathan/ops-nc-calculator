<style>
  :root{
    --navy:#1a2e4a; --navy-2:#223a5c; --blue:#1e4d8c; --blue-mid:#2563a8;
    --teal:#2a9d8f; --teal-lt:#3bbfb0;
    --ink:#2d3748; --grey-mid:#4a5568; --grey-soft:#5b6b80; --line:#e2e8f0; --grey-pale:#f0f4f8;
    --white:#ffffff; --red:#c0392b; --amber:#8f5f0f; --green:#356b4e;
    --shadow:0 1px 2px rgba(26,46,74,.06), 0 8px 24px rgba(26,46,74,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);
       background:radial-gradient(900px 500px at 12% 18%,rgba(42,157,143,.07),transparent 60%),
                  radial-gradient(900px 600px at 92% 40%,rgba(30,77,140,.08),transparent 60%),
                  linear-gradient(180deg,#e6edf5 0%,#f0f4f8 45%,#e9eff6 100%);background-color:#eaf0f6;min-height:100vh;
       font-feature-settings:'tnum' 1,'cv11' 1;padding-bottom:env(safe-area-inset-bottom);line-height:1.45}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* Header */
  header{position:relative;overflow:hidden;color:#fff;padding:28px 16px 92px;
         background:radial-gradient(700px 260px at 88% -10%,rgba(59,191,176,.38),transparent 65%),
                    radial-gradient(600px 300px at 0% 120%,rgba(37,99,168,.55),transparent 65%),
                    linear-gradient(135deg,#142640 0%,#1a2e4a 50%,#1e4d8c 130%)}
  header::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
         background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 56px)}
  header .wrap{position:relative;z-index:1}
  .wrap{max-width:1040px;margin:0 auto}
  .brand{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px 20px}
  .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--teal-lt),var(--teal) 55%,#23857a);display:grid;place-items:center;flex-shrink:0;
        box-shadow:0 6px 16px rgba(10,24,44,.35),inset 0 1px 0 rgba(255,255,255,.35)}
  .mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .brand h1{margin:0;font-size:clamp(17px,2.3vw,22px);font-weight:600;letter-spacing:-.015em;line-height:1.25}
  .brand p{margin:3px 0 0;font-size:13px;color:#aebdd1;font-weight:400}
  .accent{height:3px;background:linear-gradient(90deg,var(--teal),var(--teal-lt))}

  main{position:relative;z-index:2;margin:-60px auto 0;padding:0 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
  main > *, #out > *{max-width:1040px;width:100%;margin-left:auto;margin-right:auto}
  .card{background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);border-radius:16px;
        box-shadow:0 1px 2px rgba(26,46,74,.06),0 10px 30px rgba(26,46,74,.10);border:1px solid rgba(255,255,255,.9);
        outline:1px solid rgba(26,46,74,.05);outline-offset:-1px}

  /* Controls */
  .controls{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--grey-mid);margin-bottom:6px}
  input[type=date]{width:100%;height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:17px;font-weight:600;
       color:var(--navy);background:#fff;transition:border-color .15s,box-shadow .15s}
  input[type=date]:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(42,157,143,.15)}

      <span class="sw"><input type="checkbox" id="extChk" role="switch"><i></i></span>
    </label>
    <button class="btn" id="resetBtn" type="button">Reset</button>
  </section>

  <div id="out" style="display:contents"></div>
</main>

  function parseLocal(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }

  function fmt(d){ return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(d); }
  function daysLeft(d){
    const t=new Date(); t.setHours(0,0,0,0);
    const x=new Date(d); x.setHours(0,0,0,0);
    return Math.ceil((x.getTime()-t.getTime())/86400000);
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function plural(n,w){ return n+' '+w+(n===1?'':'s'); }

  function statusFor(date){
    const n=daysLeft(date);
    if(n<0)   return {cls:'over', text:plural(Math.abs(n),'day')+' overdue'};
    if(n===0) return {cls:'warn', text:'Due today'};
    if(n<=7)  return {cls:'warn', text:plural(n,'day')+' left'};

      <div class="rs"><span class="dot"></span><span>${esc(text)}</span><span class="of">Day ${dn} of ${tot}</span></div>

  function copyText(text,okMsg){

      ta.style.cssText='position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); done(ok);

    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>done(true),fallback); } else { fallback(); }

  /* Definitions: OPSM Chapter 8: AOC Management, (c) Non-Compliance Levels and Resolution Time Frames */
  const RESUB='In the case of unsatisfactory CAP responses, the operator will be required to resubmit their CAPs within the allowable timeframe and within 3 allowable CAP response attempts.';
  const DEFS={
    l1:{tab:'L1',title:'Level 1 Finding (L1)',
      def:`<p>A level 1 finding shall be issued by the competent authority when any significant Non-Compliance is detected with the applicable requirements, with the organization's procedures and manuals or with the terms of an approval, certificate, specialized operation authorization or with the content of a declaration <b>which lowers safety or seriously endangers flight safety.</b></p>
        <p>The level 1 findings shall include, but are not limited to:</p>
        <ol class="dl">
          <li><span class="dn">(1)</span><span>Failure to give the competent authority access to the facilities or *documents of the organization;</span></li>
          <li><span class="dn">(2)</span><span>Obtaining or maintaining the validity of the organization certificate or specific approvals by falsification of submitted documentary evidence;</span></li>
          <li><span class="dn">(3)</span><span>Evidence of malpractice or fraudulent use of the organization's certificate or specific approvals;</span></li>
          <li><span class="dn">(4)</span><span>The lack of an accountable manager.</span></li>
          <li><span class="dn">(5)</span><span>The absence (omission, not addressed) or total breakdown (commission, failure, not implemented) of a system to meet a specified requirement.<br>Several level 2 non-compliance against one requirement, or requirements for a same topic can represent a total breakdown of the system and thus be considered as a level 1 non-compliance.</span></li>
          <li><span class="dn">(6)</span><span>A Non-Compliance or a series of non-compliance that in the judgement and experience of the auditor is likely to either result in the failure of the management system or to substantially reduce its ability to assure controlled processes and products shall be categorized as a level 1.</span></li>
        </ol>
        <p class="dnote"><i>*Note: documents mean data records or documents that only relating to the audit/inspection and not include irrelevant data records or documents such as personal privacy data or documents that protected by investigation law etc.</i></p>`,
      resp:`<p>For L1 findings, the operator shall submit their corrective action plan (CAP) that addresses the root cause to CAAT within a maximum of 3 days after the issuance. ${RESUB}</p>`},
    l2:{tab:'L2',title:'Level 2 Finding (L2)',
      def:`<p>A level 2 finding shall be issued by CAAT when a non-compliance is detected against the operator's procedures or manuals, applicable regulations and requirements, the terms of an approval or a certificate, specific approvals, or with the contents of a declaration <b>which could lower safety or seriously hazards flight safety.</b></p>`,
      resp:`<p>The operator is required to submit a corrective action plan that addresses the root cause within 30 days after the finding has been uploaded, followed by a 30-day period of CAP implementation. In total, the timescale for corrective action should not exceed 60 days. In the case where an extension is requested by the operator, the allowable period for CAP implementation can be extended by 60 days (not exceeding the initial duration granted to resolve the finding).</p>

          if(lane.dir<0) el.firstChild.style.transform='scaleX(-1)';
          if(type==='crook') el.insertAdjacentHTML('beforeend','<b class="pts">15 pts!</b>');
          addHL(el,lane.dir); road.appendChild(el);
          const an=el.animate([{transform:'translateX('+from+'px)'},{transform:'translateX('+to+'px)'}],{duration:dur,delay:delay,easing:'linear',fill:'both'});
          if(type==='crook') el.animate([{translate:'0 0'},{translate:'0 -2px'},{translate:'0 1px'},{translate:'0 0'}],{duration:420,iterations:Infinity,easing:'ease-in-out'});
          an.onfinish=()=>{ el.remove(); if(done) done(); };
          return el;
        };
        const crook=mk('crook',0); arm(crook,pr,cur,.3);
        const pol=mk('police',gap,()=>release(pr)); arm(pol,pr,cur,.3); follow(pol,crook,pr,cur,gap);
      };
      go();
      return true;
    };
    /* black criminal car: 25% faster than the criminal car, then 20% faster again, chased by a police car.
       About every 20 seconds, and never twice within 10 seconds of each other. Worth 25 points. */
    const blackCar=relT=>{
      if(!live()) return;
      if(busy||ambApi.paused){ blackT=setTimeout(()=>blackCar(relT),400); return; }
      const W=road.clientWidth; if(W<200){ planBlack(relT+20000); return; }
      const pr=freePair(); if(!pr){ blackT=setTimeout(()=>blackCar(relT),400); return; }
      busy=true; pr[0].chase=pr[1].chase=true;
      const go=()=>{
        if(!live()) return;
        if(pr[0].n>0||pr[1].n>0||document.hidden||ambApi.paused||performance.now()<Math.max(relT,ambBlackAt+10000)){ setTimeout(go,150); return; }
        ambBlackAt=performance.now();
        const cur=Math.floor(rnd()*2), lane=pr[cur];
        const speed=106*3*1.25*1.2, dur=(W+2*(VW+8))/speed*1000, gap=(VW+26)/speed*1000;
        const a=-(VW+8), z=W+8, from=lane.dir>0?a:z, to=lane.dir>0?z:a;
        pr[0].n=pr[1].n=1;
        const el=document.createElement('div'); el.className='veh black'; el.style.top=lane.top+'px'; el.innerHTML=VART.black(); el.dataset.pts=25;
        if(lane.dir<0) el.firstChild.style.transform='scaleX(-1)';
        el.insertAdjacentHTML('beforeend','<b class="pts b">25 pts!</b>');
        addHL(el,lane.dir); road.appendChild(el);
        const ab=el.animate([{transform:'translateX('+from+'px)'},{transform:'translateX('+to+'px)'}],{duration:dur,easing:'linear',fill:'both'});
        ab.onfinish=()=>el.remove();
        arm(el,pr,cur,.3);
        const pc=document.createElement('div'); pc.className='veh police'; pc.style.top=lane.top+'px'; pc.innerHTML=VART.police(); pc.dataset.pts=5;
        if(lane.dir<0) pc.firstChild.style.transform='scaleX(-1)';
        addHL(pc,lane.dir); road.appendChild(pc);
        const ap=pc.animate([{transform:'translateX('+from+'px)'},{transform:'translateX('+to+'px)'}],{duration:dur,delay:gap,easing:'linear',fill:'both'});
        ap.onfinish=()=>{ pc.remove(); release(pr); };
        arm(pc,pr,cur,.3); follow(pc,el,pr,cur,gap);
        planBlack(performance.now()+20000);
      };
      go();
    };
    const planBlack=relT=>{ clearTimeout(blackT); blackT=setTimeout(()=>blackCar(relT),Math.max(0,relT-7000-performance.now())); };
    planBlack(performance.now()+12000);
    /* CAAT Van: white with blue CAAT lettering, same speed as the red criminal car, dodges the mouse about 85% of the time, 50 points */
    const dodgeCar=relT=>{
      if(!live()) return;
      if(busy||ambApi.paused){ dodgeT=setTimeout(()=>dodgeCar(relT),500); return; }
      const W=road.clientWidth; if(W<200){ planDodge(relT+24000); return; }
      const pr=freePair(); if(!pr){ dodgeT=setTimeout(()=>dodgeCar(relT),500); return; }
      busy=true; pr[0].chase=pr[1].chase=true;
      const go=()=>{
        if(!live()) return;
        if(pr[0].n>0||pr[1].n>0||document.hidden||ambApi.paused||performance.now()<relT){ setTimeout(go,200); return; }
        const cur=Math.floor(rnd()*2), lane=pr[cur];
        const speed=106*3, dur=(W+2*(VW+8))/speed*1000, a=-(VW+8), z=W+8, from=lane.dir>0?a:z, to=lane.dir>0?z:a;
        pr[0].n=pr[1].n=1;
        const el=document.createElement('div'); el.className='veh bank dodger'; el.style.top=lane.top+'px'; el.innerHTML=VART.bank(); el.dataset.pts=50;
        if(lane.dir<0) el.firstChild.style.transform='scaleX(-1)';
        el.insertAdjacentHTML('beforeend','<b class="pts">50 pts!</b>'); addHL(el,lane.dir);
        el.classList.add('glow'); el.style.setProperty('--hz','#ffffff'); el.insertAdjacentHTML('afterbegin','<i class="aura"></i>');   /* CAAT Van glows white and is safe to click */
        road.appendChild(el);
        const an=el.animate([{transform:'translateX('+from+'px)'},{transform:'translateX('+to+'px)'}],{duration:dur,easing:'linear',fill:'both'});
        an.onfinish=()=>{ el.remove(); release(pr); };
        arm(el,pr,cur,.85);
        planDodge(performance.now()+24000);
      };
      go();
    };
    const planDodge=relT=>{ clearTimeout(dodgeT); dodgeT=setTimeout(()=>dodgeCar(relT),Math.max(0,relT-6000-performance.now())); };
    planDodge(performance.now()+16000);
    /* hazard trucks: at least one released every 8 seconds */
    const HZT=['rad','expl','bio']; let hzPending=false;
    const hzGo=()=>{
      if(!live()) return;
      if(ambApi.paused){ hzT=setTimeout(hzGo,300); return; }
      if(!document.hidden){
        const ls=lanes.slice().sort(()=>rnd()-.5), t=HZT[Math.floor(rnd()*3)];
        if(!ls.some(l=>spawn(l,t,false))){ hzPending=true; hzT=setTimeout(hzGo,150); return; }
        hzPending=false;
      }
      hzT=setTimeout(hzGo,6300+rnd()*700);
    };
    clearTimeout(hzT); hzT=setTimeout(hzGo,2500);
    lanes.forEach(l=>spawn(l,pick(),true));
    ambT=setTimeout(tick,900);
    setTimeout(()=>{ if(live()) chase(); },3000);

    /* shooting stars (ดาวตก) across the night sky */
    const shoot=outEl.querySelector('.shoot');
    if(shoot){
      shoot.innerHTML='';
      const star=()=>{
        const W=shoot.clientWidth, H=Math.min(shoot.clientHeight*.5,520); if(W<200) return;
        const dir=rnd()<.5?1:-1, th=(18+rnd()*18)*Math.PI/180, len=60+rnd()*50, travel=170+rnd()*150, dur=850+rnd()*450;
        const x0=W*(.08+rnd()*.84), y0=8+rnd()*H*.8, phi=dir>0?th:Math.PI-th;
        const dx=Math.cos(phi)*travel, dy=Math.sin(phi)*travel, deg=phi*180/Math.PI;
        const el=document.createElement('i'); el.className='ss'; el.style.width=len+'px'; shoot.appendChild(el);
        const T=(x,y)=>'translate('+x+'px,'+y+'px) rotate('+deg+'deg)';
        const an=el.animate([{opacity:0,transform:T(x0,y0)},{opacity:1,offset:.18},{opacity:.9,offset:.6},{opacity:0,transform:T(x0+dx,y0+dy)}],{duration:dur,easing:'ease-in',fill:'both'});
        an.onfinish=()=>el.remove();
      };
      const st=()=>{
        if(!live()) return;
        if(!document.hidden && !ambApi.paused){ star(); if(rnd()<.25) setTimeout(()=>{ if(live()&&!ambApi.paused) star(); },250+rnd()*500); }
        shootT=setTimeout(st,3500+rnd()*5500);
      };
      shootT=setTimeout(st,1500);
    }

    const bird=(pre,dx,dy)=>{
      const W=sky.clientWidth, H=sky.clientHeight; if(W<200) return;
      const dir=rnd()<.5?1:-1, size=14+rnd()*9, y0=4+rnd()*(H-26), dur=(W+90)/(26+rnd()*30)*1000, delay=pre?-rnd()*dur*.8:0;
      const el=document.createElement('div'); el.className='bird'; el.style.width=size+'px';
      el.innerHTML='<span style="display:block;transform:scaleX('+dir+')">'+BIRD+'</span>';
      sky.appendChild(el);
      const a=-40, z=W+40, N=5, kf=[];
      for(let i=0;i<=N;i++){ const x=dir>0?a+(z-a)*i/N:z-(z-a)*i/N; kf.push({transform:'translate('+(x+(dx||0))+'px,'+Math.max(0,Math.min(H-12,y0+(dy||0)+(i%2?-1:1)*rnd()*8))+'px)'}); }
      const ab=el.animate(kf,{duration:dur,delay:delay,easing:'linear',fill:'both'});
      el.firstChild.firstChild.animate([{transform:'scaleY(1)'},{transform:'scaleY(.35)'}],{duration:260+rnd()*160,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});
      ab.onfinish=()=>el.remove();
    };
    const flock=pre=>{ const n=rnd()<.4?3:(rnd()<.5?2:1); for(let i=0;i<n;i++) bird(pre,-i*22,(i%2?1:-1)*i*6); };
    const bt=()=>{
      if(!sky.isConnected) return;
      if(!document.hidden && !ambApi.paused && sky.children.length<7) flock(false);
      birdT=setTimeout(bt,2200+rnd()*3800);
    };
    flock(true); flock(true);
    birdT=setTimeout(bt,1800);
  }
  const AIRCRAFT=['plane','jet','heli'];
  let trackUntil=0, tracking=false;
  function placeTag(){
    const root=outEl.querySelector('.rwx'); if(!root) return;
    const pl=root.querySelector('.plane'); let tg=root.querySelector('.rtag');
    const vid=pl?((pl.className.match(/\bv-(\w+)/)||[])[1]||''):'';
    if(!pl||AIRCRAFT.indexOf(vid)<0){ if(tg) tg.remove(); return; }
    if(!tg){ tg=document.createElement('div'); tg.className='rtag'; tg.setAttribute('aria-hidden','true'); tg.innerHTML='<b>HS-OPS</b>'; root.appendChild(tg); }
    const R=root.getBoundingClientRect(), r=pl.getBoundingClientRect();
    tg.style.left=(r.left+r.width/2-R.left)+'px'; tg.style.top=(r.top-R.top)+'px';
    const o=getComputedStyle(pl).opacity; tg.style.opacity=o;
  }
  function trackTag(ms){
    trackUntil=Math.max(trackUntil,performance.now()+(ms||0));
    if(tracking) return; tracking=true;
    const f=()=>{ placeTag(); if(flying||performance.now()<trackUntil) requestAnimationFrame(f); else { tracking=false; placeTag(); } };
    f();
  }
  window.addEventListener('resize',()=>placeTag());
  function takeOff(plane){
    if(flying||!plane.isConnected) return;
    const tl=plane.closest('.tl'), ban=tl.querySelector('.banner'), rw=plane.closest('.rw');
    const token=++flight; flying=true; planeTried=true; plane.classList.add('known');
    const ph=rw.querySelector('.phint'); if(ph) ph.remove();
    let n=3;
    const tick=()=>{
      if(token!==flight || !plane.isConnected) return;
      if(n>0){ ban.textContent='Take-off in '+n; ban.classList.add('show'); n--; setTimeout(tick,1000); }
      else { ban.classList.remove('show'); flying=false; launch(plane); }
    };
    tick(); trackTag(0);
  }
  function launch(plane){
    if(flying||!plane.isConnected) return;
    const rw=plane.closest('.rw'), lit=rw.querySelector('.lit'), tl=plane.closest('.tl'), ban=tl.querySelector('.banner');
    const token=++flight; flying=true; planeTried=true; plane.classList.add('known');
    const alive=()=>token===flight && plane.isConnected;
    let bt=0; const say=t=>{ ban.textContent=t; ban.classList.add('show'); clearTimeout(bt); bt=setTimeout(()=>ban.classList.remove('show'),1400); };
    const at=(ms,fn)=>setTimeout(()=>{ if(alive()) fn(); },ms);
    const vid=(plane.className.match(/\bv-(\w+)/)||[])[1]||'plane', V=VEH[vid]||VEH.plane, TX=V.say, vert=V.mode==='vert';
    const ph0=rw.querySelector('.phint'); if(ph0) ph0.remove();
    if(reduceMotion()){ say(TX[0]); at(1300,()=>{ flying=false; }); return; }

    const W=rw.clientWidth, x0=plane.offsetLeft, litW=lit.offsetWidth, SLOW=1.4, D=V.D*SLOW/.75, RET=V.RET*SLOW;   /* landing runs 40% slower; take-off a further 25% slower (speed x .75) */
    const op=parseFloat(getComputedStyle(plane).opacity)||1;
    const roll=vert?x0:Math.max(x0,Math.min(W-8,Math.max(W*.9,x0+W*.12)));
    const ax=V.wide?(parseFloat(plane.style.getPropertyValue('--ax'))||50):50;
    const tf=(dy,deg,sc)=>'translate(-'+ax+'%,calc(-50% - '+dy+'px)) rotate('+deg+'deg) scale('+sc+')';
    const S=sc=>1+(sc-1)*V.sk, O=o=>o==='o'?op:o;
    plane.classList.remove('go'); lit.classList.remove('go'); plane.classList.add('flying'); rw.classList.add('tko');
    hideProbe();

    const fly=plane.animate(V.out.map(p=>{ const k={offset:p[0],left:(x0+(roll-x0)*p[1]+W*p[2])+'px',transform:tf(p[3],V.r0+p[4],S(p[5])),opacity:O(p[6])}; if(p[7]) k.easing=p[7]; return k; }),{duration:D,fill:'forwards'});
    const ro=V.out[1][0];
    const litA=vert
      ? lit.animate([{opacity:1,offset:0},{opacity:0,offset:.25},{opacity:0,offset:1}],{duration:D,fill:'forwards'})
      : lit.animate([{width:litW+'px',offset:0,easing:EA},{width:roll+'px',opacity:1,offset:ro},{width:roll+'px',opacity:1,offset:ro+.16},{width:roll+'px',opacity:0,offset:1}],{duration:D,fill:'forwards'});
    if(!vert){ const N=8; puffs(rw,Array.from({length:N},(_,i)=>x0+(roll-x0)*(i/(N-1))),Array.from({length:N},(_,i)=>D*ro*Math.sqrt(i/(N-1)))); }
    else if(vid==='heli'){ puffs(rw,[x0-46,x0-30,x0-14,x0+2,x0+18,x0+34,x0+50,x0-38,x0+42],[0,60,120,180,240,300,360,420,480].map(t=>t*SLOW/.75)); }

    say(TX[0]); compliment();
    at(D*.48,()=>say(TX[1]));
    at(D*.74,()=>say(TX[2]));
    if(vid==='jet') at(D*.5,()=>ring(rw,roll+W*.02));
    at(D+250,()=>{
      fly.cancel(); litA.cancel(); rw.classList.remove('tko'); if(!V.keepFly) plane.classList.remove('flying');
      if(vert){ lit.animate([{opacity:0},{opacity:1}],{duration:RET}); } else { plane.classList.add('go'); lit.classList.add('go'); }
      plane.animate(V.ret.map(p=>{ const k={offset:p[0],transform:tf(p[2],V.r0+p[3],S(p[4])),opacity:O(p[5])}; if(vert) k.left=(x0+W*p[1])+'px'; if(p[6]) k.easing=p[6]; return k; }),{duration:RET});
      say(TX[3]);
    });
    at(D+250+RET,()=>{
      if(V.keepFly) plane.classList.remove('flying');
      puffs(rw,vert?[x0-24,x0-10,x0+4,x0+18,x0+30]:[x0-50,x0-38,x0-26,x0-14,x0-4],[0,60,120,180,240]);
      say(TX[4]); flying=false;
    });
  }

  /* vehicle picker */
  function applyVehicle(){
    const root=outEl.querySelector('.tl'); if(!root||!tlState) return;
    const pl=root.querySelector('.plane'); if(!pl) return;
    const vid=effVid(tlState.xmas), V=VEH[vid];
    const keep=['idle','known','go'].filter(c=>pl.classList.contains(c));
    pl.className=['plane','v-'+vid].concat(V.wide?['wide']:[],vid==='santa'?['santa']:[],keep,['swap']).join(' ');
    pl.innerHTML=ART[vid]+'<i class="beam"></i><i class="jet"></i><i class="beacon"></i>';
    pl.style.setProperty('--ax',Math.round(30+40*tlState.pct/100));
    pl.setAttribute('aria-label',V.label+' take-off');
    setTimeout(()=>pl.classList.remove('swap'),450); trackTag(650);
    const h=root.querySelector('.hint'); if(h) h.textContent='Tap a card or a gate to see its date. Tap '+V.hint+' for a surprise.';
    const ph=root.querySelector('.phint'); if(ph) ph.remove();
  }
  function setVeh(id){
    if(!VEH[id]||id==='santa'||flying) return;
    veh=id; try{ localStorage.setItem('ncVeh',id); }catch(e){}
    outEl.querySelectorAll('.vb').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute('data-v')===id?'true':'false'));
    applyVehicle();
  }

  outEl.addEventListener('click',e=>{
    const vb=e.target.closest('.vb'); if(vb){ setVeh(vb.getAttribute('data-v')); return; }
    const vh=e.target.closest('.veh'); if(vh){ hitVeh(vh); return; }
    if(e.target.closest('.rsp')){ airResume(); return; }
    if(e.target.closest('.lbs')){ LB.open=false; LB.msg=''; airResume(); return; }
    if(e.target.closest('.lbx')){ LB.open=false; lbRender(); if(ambApi.paused) airResume(); return; }
    if(e.target.closest('.lbr')){ lbLoad(); return; }
    const hb=e.target.closest('.hpt'); if(hb){ hpOpen(hb); return; }
    const lt=e.target.closest('.lbt'); if(lt){ LB.open=!LB.open; LB.msg=''; lbRender(); if(LB.open&&LB.state!=='loading') lbLoad(); return; }
    const sv=e.target.closest('.sv'); if(sv){ LB.open=true; LB.msg=''; lbRender(); if(LB.state==='idle') lbLoad(); const f=outEl.querySelector('.lbf input'); if(f){ f.focus(); } const pn=outEl.querySelector('#lb'); if(pn&&pn.scrollIntoView) pn.scrollIntoView({block:'nearest',behavior:'smooth'}); return; }
    const at=e.target.closest('.ambt'); if(at){
      amb=!amb;
      at.setAttribute('aria-checked',amb?'true':'false'); at.classList.toggle('lure',!amb); at.innerHTML=ambInner();
      const tl=at.closest('.tl'); if(tl) tl.classList.toggle('noamb',!amb);
      startAmbient(); trackTag(0); return;
    }
    const a=e.target.closest('[data-act]');
    if(a){ const act=a.getAttribute('data-act'); if(act==='copydate') copyDate(); else if(act==='deftab'){ defLv=a.getAttribute('data-lv'); applySel(); const t=$('dp').querySelector('.dtab[aria-selected="true"]'); if(t) t.focus(); } else { selDay=null; applySel(); } return; }
    const t=e.target.closest('.tile[data-d],.mk[data-d]'); if(t){ selectDay(+t.getAttribute('data-d')); return; }
    const pl=e.target.closest('.plane'); if(pl){ takeOff(pl); return; }
    const b=e.target.closest('button'); if(!b||b.disabled) return; if(b.id==='copyBtn') copySummary(); else if(b.id==='linkBtn') copyLink(); else if(b.id==='printBtn') window.print();
  });
  outEl.addEventListener('submit',e=>{ const f=e.target; if(f&&f.classList&&f.classList.contains('lbf')){ e.preventDefault(); lbSubmit(f); } });
  outEl.addEventListener('keydown',e=>{
    if(e.key==='Escape' && selDay!==null){ selDay=null; applySel(); return; }
    if(e.key!=='Enter' && e.key!==' ') return;
    const t=e.target.closest && e.target.closest('.tile[data-d],.mk[data-d],.plane');
    if(t && t===e.target){ e.preventDefault(); t.click(); }
  });
  outEl.addEventListener('pointermove',e=>{
    const t=e.target.closest && e.target.closest('.tl'); if(!t) return;
    const r=t.getBoundingClientRect();
    t.style.setProperty('--mx',(e.clientX-r.left)+'px'); t.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
  issueEl.addEventListener('input',render);
  issueEl.addEventListener('change',render);
  extChk.addEventListener('change',render);
  $('todayBtn').addEventListener('click',()=>{ issueEl.value=todayStr(); render(); });
  $('resetBtn').addEventListener('click',()=>{ issueEl.value=todayStr(); extChk.checked=false; render(); });

  $('asof').innerHTML='Today <b>'+esc(fmt(new Date()))+'</b>';
  issueEl.value=todayStr();
  applyParams();
  render();
})();
</script>
